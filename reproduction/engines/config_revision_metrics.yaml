project_root: __WORKSPACE__
benchmark_root: data/benchmarks
splits_dir: data/splits
output_root: results/revision/metrics
n_jobs: 4
blas_threads: 1
random_seed: 20260726
bootstrap:
  n_iter: 2000
  n_iter_slow: 1000
  ci_level: 0.95
  method: percentile
  cluster_default: dominant_accession
mimag:
  high:
    completeness_min: 90.0
    contamination_max: 5.0
  medium:
    completeness_min: 50.0
    contamination_max: 10.0
  completeness_inclusive: true
  contamination_inclusive: false
  classes:
  - high
  - medium
  - low
thresholds:
  contamination:
  - 5.0
  - 10.0
  completeness:
  - 50.0
  - 90.0
strata:
  contamination_bins:
    edges:
    - 0.0
    - 0.0001
    - 5.0
    - 10.0
    - 20.0
    - 40.0
    - 100.1
    labels:
    - 0 (uncontaminated)
    - (0,5)
    - '[5,10)'
    - '[10,20)'
    - '[20,40)'
    - '[40,100]'
  min_phylum_n: 30
tools:
  magicc_v5:
    file: magicc_v5_predictions.tsv
    label: MAGICC v5 (released, v0.3.0)
    short: MAGICC v5
    role: primary
    note: 9,249 core-gene 9-mers + 7 k-mer summary features
  magicc_v4:
    file: magicc_v4_predictions.tsv
    label: MAGICC v4 (numbers in submitted manuscript)
    short: MAGICC v4
    role: secondary
    note: same feature set as v5, trained on the 800k dataset
  magicc_v3:
    file: magicc_predictions.tsv
    label: MAGICC v3 (SUPERSEDED - uses 20 assembly statistics)
    short: MAGICC v3
    role: superseded
    note: 'Retained only for provenance. v3 consumed assembly statistics (contig count,
      N50, ...) that directly encode the simulated fragmentation, so its synthetic-benchmark
      accuracy is optimistic and it generalised worse; assembly statistics were removed
      in v4.

      '
  checkm2:
    file: checkm2_predictions.tsv
    label: CheckM2 1.0.1
    short: CheckM2
    role: competitor
  cocopye:
    file: cocopye_predictions.tsv
    label: CoCoPyE 0.5.0
    short: CoCoPyE
    role: competitor
  deepcheck:
    file: deepcheck_predictions.tsv
    label: DeepCheck
    short: DeepCheck
    role: competitor
statistics:
  reference_tool: magicc_v5
  comparison_tools:
  - magicc_v4
  - checkm2
  - cocopye
  - deepcheck
  metrics:
  - abs_err_completeness
  - abs_err_contamination
  bh_alpha: 0.05
  bh_family: run
sets:
- name: set_A_v2
  dir: set_A_v2
  label: Set A (completeness gradient, 0% contamination)
  status: current
  design: 1,000 NCBI finished test-split dominants; completeness 50-100%; no contaminants
  relatedness_rule: fixed:none (uncontaminated)
- name: set_B_v2
  dir: set_B_v2
  label: Set B (contamination gradient, 100% completeness)
  status: current
  design: 1,000 NCBI finished test-split dominants at 100% completeness; cross-phylum
    contamination 0-80%
  relatedness_rule: fixed:cross_phylum
- name: set_C
  dir: set_C
  label: Set C (Patescibacteriota) - SUPERSEDED (training leakage)
  status: superseded_leaky
  design: 1,000 Patescibacteriota dominants drawn from train+val+test; completeness
    50-100%, cross-phylum contamination 0-100%
  relatedness_rule: fixed:cross_phylum
  superseded_by: set_C_clean
- name: set_D
  dir: set_D
  label: Set D (Archaea) - SUPERSEDED (training leakage)
  status: superseded_leaky
  design: 1,000 archaeal dominants drawn from train+val+test; completeness 50-100%,
    cross-phylum contamination 0-100%
  relatedness_rule: fixed:cross_phylum
  superseded_by: set_D_clean
- name: set_E
  dir: set_E
  label: Set E (realistic mixture)
  status: current
  design: 1,000 NCBI finished test-split dominants; 200 pure + 200 complete + 600
    mixed (70% cross-/30% within-phylum)
  relatedness_rule: from_sample_type
- name: set_C_clean
  dir: set_C_clean
  label: Set C-clean (Patescibacteriota, held-out test split)
  status: current
  design: 100 test-split Patescibacteriota references x 10 simulations; completeness
    50-100%, cross-phylum contamination 0-100% from test split only
  relatedness_rule: fixed:cross_phylum
- name: set_D_clean
  dir: set_D_clean
  label: Set D-clean (Archaea, held-out test split)
  status: current
  design: 100 test-split archaeal references x 10 simulations; cross-phylum contamination
    0-100% from test split only
  relatedness_rule: fixed:cross_phylum
- name: set_A
  dir: set_A
  label: Set A v1 (superseded by Set A v2)
  status: legacy_superseded
  tier: secondary
  design: 600 genomes, completeness gradient; replaced by set_A_v2
  relatedness_rule: fixed:none (uncontaminated)
  superseded_by: set_A_v2
- name: set_B
  dir: set_B
  label: Set B v1 (superseded by Set B v2)
  status: legacy_superseded
  tier: secondary
  design: 600 genomes, contamination gradient; replaced by set_B_v2
  relatedness_rule: fixed:cross_phylum
  superseded_by: set_B_v2
- name: motivating_v2_set_A
  dir: motivating_v2/set_A
  label: 'Motivating Set A (Table S1a): completeness gradient'
  status: motivating
  tier: secondary
  design: 1,000 finished test-split dominants, completeness gradient; existing tools
    only in the manuscript
  relatedness_rule: fixed:none (uncontaminated)
- name: motivating_v2_set_B
  dir: motivating_v2/set_B
  label: 'Motivating Set B (Table S1b): contamination gradient'
  status: motivating
  tier: secondary
  design: 1,000 finished test-split dominants at 100% completeness, cross-phylum contamination
    0-80%
  relatedness_rule: fixed:cross_phylum
- name: motivating_v2_set_C
  dir: motivating_v2/set_C
  label: 'Motivating Set C (Table S1c): realistic mixture'
  status: motivating
  tier: secondary
  design: 1,000 finished test-split dominants, realistic mixture
  relatedness_rule: from_sample_type
- name: motivating_set_A
  dir: motivating/set_A
  label: Motivating Set A v1 (superseded)
  status: legacy_superseded
  tier: secondary
  design: 600 genomes; replaced by motivating_v2/set_A
  relatedness_rule: fixed:none (uncontaminated)
  superseded_by: motivating_v2_set_A
- name: motivating_set_B
  dir: motivating/set_B
  label: Motivating Set B v1 (superseded)
  status: legacy_superseded
  tier: secondary
  design: 1,100 genomes; replaced by motivating_v2/set_B
  relatedness_rule: fixed:cross_phylum
  superseded_by: motivating_v2_set_B
autodiscover:
  enabled: false
  patterns:
  - set_*
  - '*/set_*'
  default_status: current
  default_relatedness_rule: from_sample_type
denominators:
  completeness: completeness (%) = retained dominant-genome bp / full reference length
    of the dominant genome x 100
  contamination: contamination (%) = total contaminant bp / full reference length
    of the dominant genome x 100
  note: Both percentages use the same denominator (the full reference length of the
    dominant genome) and are therefore independent measures; contamination is not
    normalised to total assembly length or to retained dominant length.
palette:
  name: Okabe-Ito (CVD-optimised 6-colour subset)
  min_delta_e: 20.0
  tools:
    magicc_v5: '#0072B2'
    magicc_v4: '#56B4E9'
    magicc_v3: '#999999'
    checkm2: '#D55E00'
    cocopye: '#F0E442'
    deepcheck: '#000000'
  mimag:
    high: '#08306B'
    medium: '#4292C6'
    low: '#BDD7E7'
  sequential_cmap: cividis
  markers:
    magicc_v5: o
    magicc_v4: s
    magicc_v3: x
    checkm2: ^
    cocopye: D
    deepcheck: v
